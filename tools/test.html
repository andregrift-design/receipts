<!doctype html><meta charset="utf-8"><title>VH5 tests</title>
<script type="importmap">{ "imports": { "/src/api.js": "/tools/mock-api.js" } }</script>
<pre id="out">running…</pre>
<script type="module">
// Logic and export tests with made-up data. Open /tools/test.html on a local server.
import { problems, summarize, splitGross, quarterRange, quarterLabel, vatLabel, usdConversion, eurConversion, lineTotal, statementProblems,
  summarizeIncome, mergeCategories, agencyOverview, parseNum, fmtNum, money, periodOf, nextPeriod, bookingPeriod, isLate, forPeriod, duplicateOf, yearFigures, ANNUAL_LABEL, vatOff, followVat, expectedVat, filingDue, filingDeadline, daysLeftLabel } from '../src/vat.js';
import { listStatements, eurUsdRates } from '/src/api.js';
import { downloadExcel, downloadPdf, numbered } from '../src/export.js';
import { buildPeriod } from '../src/overview.js';
import * as XLSX from 'https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs';

const out = []; let fail = 0;
const round = (v) => Math.round(v * 100) / 100;
const eq = (name, a, b) => { const ok = JSON.stringify(a) === JSON.stringify(b); if (!ok) fail++; out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : `\n   got ${JSON.stringify(a)}\n   want ${JSON.stringify(b)}`}`); };

// ---------- numbers ----------
eq('parse 1,500 as thousands', parseNum('1,500'), 1500);
eq('parse 1,234.56', parseNum('1,234.56'), 1234.56);
eq('parse Dutch 1.234,56', parseNum('1.234,56'), 1234.56);
eq('parse 12,50 as decimal', parseNum('12,50'), 12.5);
eq('parse € 7,920.00', parseNum('€ 7,920.00'), 7920);
eq('parse negative', parseNum('-500.00'), -500);
eq('format thousands', [fmtNum(1000), fmtNum(1234567.8), fmtNum(999)], ['1,000.00', '1,234,567.80', '999.00']);
eq('money thousands', [money(9583.2), money(1500, 'USD')], ['€9,583.20', '$1,500.00']);

// ---------- expenses ----------
const base = { id: '', status: 'done', doc_type: 'receipt', currency: 'EUR', vat_country: 'NL', created_at: '2026-01-01T00:00:00Z', file_path: 'u/x.png', file_type: 'image/png', period: '2026-Q3' };
const rs = [
  { ...base, id: 'a', receipt_date: '2026-07-03', store: 'Albert Heijn', category: 'Meals & Drinks', total: 31.30, vat_lines: [{ rate: 9, net: 20, vat: 1.8 }, { rate: 21, net: 7.85, vat: 1.65 }] },
  { ...base, id: 'b', doc_type: 'payment', receipt_date: '2026-08-10', store: 'Shell', category: 'Transportation', total: 1210, vat_lines: [{ rate: 21, net: 1000, vat: 210 }] },
  { ...base, id: 'c', receipt_date: '2026-09-01', store: 'Hotel Berlin', category: 'Accommodation', total: 119, vat_country: 'DE', vat_lines: [{ rate: 19, net: 100, vat: 19 }] },
  { ...base, id: 'd', receipt_date: '2026-09-02', store: 'NYC cab', category: 'Transportation', total: 50, currency: 'USD', fx_rate: 0.9, vat_country: 'US', vat_lines: [{ rate: null, net: 50, vat: 0 }] },
  { ...base, id: 'e', receipt_date: '2026-09-03', store: 'Parking', total: 5, status: 'review', vat_lines: [] },
];
const s = summarize(rs);
eq('groups order', s.groups.map((g) => g.key), ['NL:21', 'NL:9', 'NL:unknown', 'DE:19', 'US:none']);
eq('home vs foreign', [s.home.count, s.home.gross, s.foreign.count, s.foreign.vat], [3, 1246.3, 2, 19]);
eq('per country', s.foreign.countries.map((c) => c.name), ['Germany', 'United States']);
eq('labels', ['NL:21', 'NL:none', 'DE:19', 'US:none'].map(vatLabel), ['21% VAT (high rate)', 'No VAT / exempt', 'Germany: 19% VAT', 'United States: no VAT']);
eq('problems', [problems(rs[0]), problems({ currency: 'USD', vat_lines: [] })], [[], ['date', 'store or description', 'amount', 'exchange rate', 'VAT']]);
eq('split', [splitGross(121, 21), splitGross(10, null)], [{ net: 100, vat: 21 }, { net: 10, vat: 0 }]);
eq('quarters', [quarterRange(2026, 3), quarterRange(2026, 0).end, quarterLabel(2026, 4), quarterLabel(2026, 0)],
  [{ start: '2026-07-01', end: '2026-09-30' }, '2026-12-31', 'Q4 2026 (Oct–Dec)', '2026 (full year)']);
eq('weak VAT', [s.weakVat, s.weakCount], [210, 1]);

// ---------- periods, filing, corrections ----------
eq('periodOf / next', [periodOf('2026-09-30'), periodOf('2026-10-01'), nextPeriod('2026-Q4'), nextPeriod('2026-Q2')], ['2026-Q3', '2026-Q4', '2027-Q1', '2026-Q3']);
eq('booking period skips filed quarters', bookingPeriod('2026-08-01', new Set(['2026-Q3', '2026-Q4'])), '2027-Q1');
eq('late entry detected', [isLate({ receipt_date: '2026-08-01', period: '2026-Q4' }), isLate({ receipt_date: '2026-08-01', period: '2026-Q3' })], [true, false]);
// Hotel Berlin (Q3, filed) was 119; corrected to 140 in Q4: Q4 shows +21 gross, +3.35 VAT.
const corr = { ...rs[2], id: 'c2', corrects: 'c', period: '2026-Q4', total: 140, vat_lines: [{ rate: 19, net: 117.65, vat: 22.35 }] };
const q4 = forPeriod([...rs, corr], [...rs, corr], (p) => p === '2026-Q4');
const s4 = summarize(q4);
eq('correction books the difference', [s4.foreign.gross, s4.foreign.vat, s4.foreign.count], [21, 3.35, 1]);
eq('Q3 unchanged by correction', summarize(forPeriod([...rs, corr], [...rs, corr], (p) => p === '2026-Q3')).foreign.gross, 164);

// ---------- statements ----------
const sts = await listStatements();
eq('statement line totals', sts.map((x) => lineTotal(x.lines[0])), [4840, 750]);
eq('statements complete', sts.map((x) => statementProblems(x)), [[], []]);
eq('import date required', statementProblems({ ...sts[0], booking_date: null }), ['import date']);
eq('bad total flagged', statementProblems({ ...sts[0], total_paid: 4000 }), ['lines don’t add up to the amount paid']);
const inc = summarizeIncome(sts);
eq('income totals', [inc.fee, inc.vat, inc.paid, inc.homeVat, inc.reverseCharge], [5000, 840, 5590, 840, 52.5]);
eq('agency fee as expense', inc.categories, [{ category: 'Agency & Management', amount: 250 }]);
eq('merged categories', mergeCategories([{ category: 'Agency & Management', count: 1, net: 10, vat: 2.1, gross: 12.1 }], inc.categories).map((c) => [c.category, c.gross, c.fromStatements]), [['Agency & Management', 262.1, 250]]);
const dupe = { ...sts[0], id: 's9', created_at: '2026-10-26T12:00:00Z' };
eq('duplicate found', [duplicateOf(dupe, [...sts, dupe])?.id, duplicateOf(sts[0], [...sts, dupe])], ['s1', null]);
{
  const extra = { ...sts[0], id: 's3', fx_rate: null, currency: 'GBP', lines: [
    { ...sts[0].lines[0], client: 'client a ltd', job_date: '2026-07-20', fee: 100, kind: 'day_rate' },
    { ...sts[0].lines[0], client: 'Client C', job_date: '2026-07-21', fee: 50, kind: 'usage' }] };
  const ov = agencyOverview([...sts, extra]);
  eq('agencies and clients', [ov.map((a) => a.name), ov[1].clients.map((c) => [c.name, c.jobs])], [['Alpine Models e.U.', 'Example Models B.V.'], [['Client A Ltd', 2], ['Client C', 1]]]);
}

// ---------- the period view (as on screen) ----------
const d3 = buildPeriod({ receipts: rs, statements: sts, year: 2026, quarter: 3, conv: eurConversion });
eq('Q3: receipts and statements by quarter', [d3.rec.length, d3.sts.map((x) => x.id)], [5, ['s1']]);
eq('Q3 VAT position', d3.vatDue, round(840 - 213.45));
const dy = buildPeriod({ receipts: rs, statements: sts, year: 2026, quarter: 0, conv: eurConversion });
eq('year includes Q1 statement', dy.sts.map((x) => x.id).sort(), ['s1', 's2']);

// ---------- exports ----------
const files = {};
const origUrl = URL.createObjectURL;
URL.createObjectURL = (blob) => { files.last = blob; return origUrl(blob); };
HTMLAnchorElement.prototype.click = function () { files[this.download] = files.last; };
const meta = { title: 'Q3 2026', owner: 'me@example.com', fileBase: 'VH5 2026-Q3', currency: 'EUR', conv: eurConversion };
await downloadExcel(d3, meta);
const wb = XLSX.read(await files['VH5 2026-Q3.xlsx'].arrayBuffer(), { cellDates: true });
eq('excel sheets', wb.SheetNames, ['Summary', 'Expenses', 'Income']);
const sum = XLSX.utils.sheet_to_json(wb.Sheets.Summary, { header: 1 }).map((r) => r[0]).filter(Boolean);
const order = ['1. Expenses (by receipt date)', 'Netherlands', 'Foreign', 'Per category', '2. Income (agency statements, by import date)', 'Dutch agencies', 'Foreign agencies', '3. Dutch VAT position'];
eq('excel in overview order', order.map((t) => sum.indexOf(t)).every((v, i, a) => v >= 0 && (i === 0 || v > a[i - 1])), true);
const sumRows = XLSX.utils.sheet_to_json(wb.Sheets.Summary, { header: 1 });
eq('excel NL total', sumRows.find((r) => r[0] === 'Total Netherlands'), ['Total Netherlands', 3, 1027.85, 213.45, 1246.3]);
eq('excel Dutch agencies total', sumRows.find((r) => r[0] === 'Total Dutch agencies'), ['Total Dutch agencies', 1, 4000, 840, 0, 4840]);
const det = XLSX.utils.sheet_to_json(wb.Sheets.Expenses);
eq('excel expense row', [det.find((r) => /Shell/.test(r.Store))?.['Gross EUR'], det[0]['Receipt date'] instanceof Date, det.find((r) => /Shell/.test(r.Store))?.['VAT return']], [1210, true, 'Yes']);
const incRows = XLSX.utils.sheet_to_json(wb.Sheets.Income);
eq('excel income row', incRows.map((r) => [r.Agency, r['Fee EUR'], r['Paid EUR'], r.Quarter]), [['Example Models B.V.', 4000, 4840, 'Q3 2026']]);

const usdc = usdConversion((dt) => ({ rate: 1.1, date: dt }));
const du = buildPeriod({ receipts: rs, statements: sts, year: 2026, quarter: 3, conv: usdc });
eq('usd: USD receipt unchanged', du.s.foreign.countries.find((c) => c.country === 'US').gross, 50);
await downloadExcel(du, { ...meta, currency: 'USD', conv: usdc, fileBase: 'usd' });
const detu = XLSX.utils.sheet_to_json(XLSX.read(await files['usd.xlsx'].arrayBuffer(), { cellDates: true }).Sheets.Expenses);
eq('usd excel', [['Net USD', 'Rate to USD', 'Rate date'].every((h) => h in detu[0]), detu.find((r) => /Shell/.test(r.Store))['Gross USD']], [true, 1331]);

let progress = 0;
await downloadPdf(d3, { ...meta, photos: true }, (n) => { progress = n; });
const pdf = files['VH5 2026-Q3.pdf'];
eq('pdf made with photo pages', [pdf.size > 5000 && (await pdf.text()).startsWith('%PDF'), progress], [true, 5]);
window.lastPdf = pdf;
progress = 0;
await downloadPdf(d3, meta, (n) => { progress = n; });
const plain = files['VH5 2026-Q3.pdf'];
eq('pdf without photos by default', [plain.size < pdf.size / 3, progress], [true, 0]);
window.plainPdf = plain;
eq('excel has no photo column', Object.keys(det[0]).includes('Photo file'), false);

// ---------- VAT against the rate ----------
eq('vat matches rate', [vatOff(37.5, 20, 7.5), vatOff(100, 21, 21.03), vatOff(1000, 21, 210.4), vatOff(1000, 21, 211.5)], [null, null, null, 210]);
eq('vat off', [vatOff(37.5, 21, 7.5), vatOff(100, 9, 21)], [7.88, 9]);
eq('vat follows net when it was computed', [followVat(100, 21, 200, 21), followVat(null, null, 50, 9), followVat(100, 20.5, 200, 21)], [42, 4.5, undefined]);
eq('filing reminder only in the last two weeks of the month after the quarter', ['2026-10-17','2026-10-18','2026-10-31','2026-11-20','2026-09-28','2027-01-25','2026-02-27','2026-04-30'].map(filingDue), [null, '2026-Q3', '2026-Q3', null, null, '2026-Q4', null, '2026-Q1']);
eq('filing deadline urgent on the last two days', ['2026-10-29','2026-10-30','2026-10-31','2027-01-30','2026-04-29','2026-04-30'].map((d) => { const x = filingDeadline(d); return x && [x.period, x.due, x.daysLeft, x.urgent]; }),
  [['2026-Q3','2026-10-31',2,false], ['2026-Q3','2026-10-31',1,true], ['2026-Q3','2026-10-31',0,true], ['2026-Q4','2027-01-31',1,true], ['2026-Q1','2026-04-30',1,true], ['2026-Q1','2026-04-30',0,true]]);
eq('days left label', [0, 1, 5].map(daysLeftLabel), ['Due today', 'Due tomorrow', '5 days left']);
eq('expected vat', [expectedVat(82.64, 21), expectedVat('x', 21)], [17.35, null]);
eq('receipt with wrong vat needs checking', problems({ receipt_date: '2026-08-01', store: 'X', total: 45, currency: 'EUR', vat_lines: [{ rate: 21, net: 37.5, vat: 7.5 }] }), ['VAT doesn’t match the rate']);
eq('statement with wrong vat needs checking', statementProblems({ ...sts[0], lines: sts[0].lines.map((l) => ({ ...l, vat: l.vat + 10 })) }).includes('VAT doesn’t match the VAT %'), true);

// ---------- annual costs only ----------
{
  const base = { status: 'done', currency: 'EUR', fx_rate: 1, vat_country: 'NL', receipt_date: '2026-08-01' };
  const list = [
    { ...base, id: 'n1', store: 'Normal', category: 'Office', total: 121, vat_lines: [{ rate: 21, net: 100, vat: 21 }] },
    { ...base, id: 'y1', store: 'Gym', category: 'Other', total: 60.5, annual_only: true, vat_lines: [{ rate: 21, net: 50, vat: 10.5 }] },
    { ...base, id: 'y2', store: 'Course', category: 'Education', total: 200, annual_only: true, vat_lines: [] },
  ];
  const a = summarize(list);
  eq('annual not in VAT groups', [a.home.count, a.homeVat, a.groups.some((g) => g.key === 'annual')], [1, 21, false]);
  eq('annual block', [a.annual.count, a.annual.gross, a.total.count, a.total.gross], [2, 260.5, 3, 381.5]);
  eq('annual counts full amount in categories', a.categories.find((c) => c.category === 'Other').gross, 60.5);
  eq('annual has no VAT problems', problems(list[2]), []);
  eq('annual label', vatLabel('annual'), ANNUAL_LABEL);
}

// ---------- year to date ----------
{
  const R = (id, date, total, extra = {}) => ({ id, status: 'done', currency: 'EUR', fx_rate: 1, vat_country: 'NL', receipt_date: date, total, vat_lines: [{ rate: 21, net: round(total / 1.21), vat: round(total - total / 1.21) }], ...extra });
  const round = (x) => Math.round(x * 100) / 100;
  const S = (id, date, fee) => ({ id, agency: 'Example Models B.V.', agency_country: 'NL', currency: 'EUR', fx_rate: 1, statement_date: date, booking_date: date,
    lines: [{ fee, vat: fee * 0.21, deductions: [{ type: 'agency_fee', amount: fee * 0.2, vat: fee * 0.042 }] }] });
  const rec = [R('r1', '2026-02-10', 121), R('r2', '2026-11-30', 242), R('r3', '2025-03-01', 60.5), R('r4', '2026-03-05', 100, { annual_only: true })];
  const sts = [S('s1', '2026-03-15', 1000), S('s2', '2025-01-20', 500)];
  const y = yearFigures(rec, sts, 2026, '10-26');
  eq('ytd skips later dates', [y.totals.receipts, y.totals.expenses, y.months.expenses[1], y.months.expenses[2]], [2, 221, 121, 100]);
  eq('ytd income and VAT', [y.totals.income, y.totals.vatOut, y.totals.vatIn, y.totals.vatDue], [1000, 210, 63, 147]);
  eq('ytd result', [y.totals.cost, y.totals.deductions, y.totals.result], [200, 200, 600]);
  const ly = yearFigures(rec, sts, 2025, '10-26');
  eq('last year same period', [ly.totals.income, ly.totals.expenses, ly.months.income[0]], [500, 60.5, 500]);
}

// ---------- live ECB rates (network) ----------
const live = await eurUsdRates('2026-09-01', '2026-09-30');
const sat = live('2026-09-05'); // a Saturday
eq('live rate weekend uses Friday', [sat?.date, sat?.rate > 0.8 && sat?.rate < 1.6], ['2026-09-04', true]);

// ---------- import queue ----------
{
  const real = await import('/src/api.js?real');
  const f = new File([new TextEncoder().encode('%PDF-1.4 made-up test file')], 'statement.pdf', { type: '' });
  try { await real.addFiles([f], 'test-user', 'statement', { booking_date: '2026-10-26' }); } catch {} // upload fails here: no server in tests
  const q = (await real.queued()).filter((i) => i.userId === 'test-user');
  eq('pdf queued with contents and booking date', q.map((i) => [i.type, i.kind, i.blob.size, i.extra?.booking_date]), [['application/pdf', 'statement', 26, '2026-10-26']]);
  const db = await new Promise((res) => { const r = indexedDB.open('receipts', 1); r.onsuccess = () => res(r.result); });
  await new Promise((res) => { const t = db.transaction('outbox', 'readwrite'); q.forEach((i) => t.objectStore('outbox').delete(i.id)); t.oncomplete = res; });
  let msg = '';
  try { await real.addFiles([new File([], 'empty.pdf', { type: 'application/pdf' })], 'test-user', 'statement'); } catch (e) { msg = e.message; }
  eq('empty pdf refused', msg.includes('empty.pdf: the file is empty'), true);
  await new Promise((res) => { const t = db.transaction('outbox', 'readwrite'); t.objectStore('outbox').put({ id: 'stuck', userId: 'test-user', kind: 'statement', blob: new Blob([]), type: 'application/pdf', ext: 'pdf', added: '2026-10-26T10:00:00Z' }); t.oncomplete = res; });
  await real.flushOutbox();
  eq('unreadable queued file removed', [(await real.queued()).some((i) => i.id === 'stuck'), real.takeDropped()], [false, 1]);
}

document.getElementById('out').textContent = `${fail ? fail + ' FAILED' : 'ALL PASS'}\n\n` + out.join('\n');
</script>
