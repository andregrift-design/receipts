<!doctype html><meta charset="utf-8"><title>Receipts tests</title>
<script type="importmap">{ "imports": { "/src/api.js": "/tools/mock-api.js" } }</script>
<pre id="out">running…</pre>
<script type="module">
import { problems, summarize, splitGross, quarterRange, quarterLabel, vatLabel, usdConversion } from '../src/vat.js';
import { eurUsdRates } from '/src/api.js';
import { downloadExcel, downloadPdf, numbered } from '../src/export.js';
import * as XLSX from 'https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs';
const out = []; let fail = 0;
const eq = (name, a, b) => { const ok = JSON.stringify(a) === JSON.stringify(b); if (!ok) fail++; out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : `\n   got ${JSON.stringify(a)}\n   want ${JSON.stringify(b)}`}`); };
const base = { id: '', status: 'done', doc_type: 'receipt', currency: 'EUR', vat_country: 'NL', created_at: '2026-01-01T00:00:00Z', file_path: 'u/x.png', file_type: 'image/png' };
const rs = [
  { ...base, id: 'a', receipt_date: '2026-07-03', store: 'Albert Heijn', total: 31.30, vat_lines: [{ rate: 9, net: 20, vat: 1.8 }, { rate: 21, net: 7.85, vat: 1.65 }] },
  { ...base, id: 'b', doc_type: 'payment', receipt_date: '2026-08-10', store: 'Shell', total: 121, vat_lines: [{ rate: 21, net: 100, vat: 21 }] },
  { ...base, id: 'c', receipt_date: '2026-09-01', store: 'Hotel Berlin', total: 119, vat_country: 'DE', vat_lines: [{ rate: 19, net: 100, vat: 19 }] },
  { ...base, id: 'd', receipt_date: '2026-09-02', store: 'NYC cab', total: 50, currency: 'USD', fx_rate: 0.9, vat_country: 'US', vat_lines: [{ rate: null, net: 50, vat: 0 }] },
  { ...base, id: 'e', receipt_date: '2026-09-03', store: 'Parking', total: 5, status: 'review', vat_lines: [] },
];
const s = summarize(rs);
eq('groups order', s.groups.map((g) => g.key), ['NL:21', 'NL:9', 'NL:unknown', 'DE:19', 'US:none']);
eq('21% group', [s.groups[0].count, s.groups[0].net, s.groups[0].vat, s.groups[0].gross], [2, 107.85, 22.65, 130.5]);
eq('USD converted', [s.groups[4].net, s.groups[4].gross], [45, 45]);
eq('home vs foreign', [s.home.count, s.home.gross, s.foreign.count, s.foreign.vat, s.foreignVat], [3, 157.3, 2, 19, 19]);
eq('per country', s.foreign.countries.map((c) => c.name), ['Germany', 'United States']);
eq('home VAT', s.homeVat, 24.45);
eq('total gross', s.total.gross, 31.3 + 121 + 119 + 45 + 5);
eq('open', s.open.map((r) => r.id), ['e']);
eq('labels', ['NL:21', 'NL:9', 'NL:none', 'DE:19', 'US:none'].map(vatLabel), ['21% VAT (high rate)', '9% VAT (low rate)', 'No VAT / exempt', 'Germany: 19% VAT', 'United States: no VAT']);
eq('problems complete', problems(rs[0]), []);
eq('problems missing', problems({ currency: 'USD', vat_lines: [] }), ['date', 'store or description', 'amount', 'exchange rate', 'VAT']);
eq('problems sum', problems({ ...rs[1], total: 130 }), ['VAT lines don’t add up to the total']);
eq('split 21', splitGross(121, 21), { net: 100, vat: 21 });
eq('split 9', splitGross(10, 9), { net: 9.17, vat: 0.83 });
eq('split none', splitGross(10, null), { net: 10, vat: 0 });
eq('Q3 range', quarterRange(2026, 3), { start: '2026-07-01', end: '2026-09-30' });
eq('Q1 leap', quarterRange(2028, 1).end, '2028-03-31');
eq('label', quarterLabel(2026, 4), 'Q4 2026 (Oct–Dec)');
eq('numbering', numbered(rs).map((n) => n.file), ['001_2026-07-03_Albert-Heijn.png', '002_2026-08-10_Shell.png', '003_2026-09-01_Hotel-Berlin.png', '004_2026-09-02_NYC-cab.png', '005_2026-09-03_Parking.png']);
eq('weak VAT', [s.weakVat, s.weakCount], [21, 1]);
// Capture downloads instead of saving them.
const files = {};
const orig = URL.createObjectURL;
URL.createObjectURL = (blob) => { files.last = blob; return orig(blob); };
HTMLAnchorElement.prototype.click = function () { files[this.download] = files.last; };
const meta = { title: 'Q3 2026', owner: 'me@example.com', fileBase: 'Receipts 2026-Q3' };
await downloadExcel(rs, meta);
const wb = XLSX.read(await files['Receipts 2026-Q3.xlsx'].arrayBuffer(), { cellDates: true });
eq('excel sheets', wb.SheetNames, ['Summary', 'Receipts']);
const sum = XLSX.utils.sheet_to_json(wb.Sheets.Summary, { header: 1 });
eq('excel NL total', sum.find((r) => r[0] === 'Total Netherlands'), ['Total Netherlands', 3, 127.85, 24.45, 157.3]);
eq('excel weak VAT', sum.find((r) => String(r[0]).includes('payment receipt'))?.[3], 21);
eq('excel foreign total', sum.find((r) => r[0] === 'Total foreign'), ['Total foreign', 2, 145, 19, 164]);
const det = XLSX.utils.sheet_to_json(wb.Sheets.Receipts);
eq('excel rows', det.length, 6);
eq('excel row 3', [det[2].Store, det[2].Document, det[2]['VAT EUR'], det[2]['VAT rate']], ['Shell', 'Payment receipt only', 21, 0.21]);
eq('excel date is a date', det[0].Date instanceof Date, true);
// USD: fixed EUR/USD 1.10 for the test; USD receipts stay as they are.
const usdc = usdConversion((d) => ({ rate: 1.1, date: d }));
const su = summarize(rs, usdc.factor);
eq('usd NL total', su.home.gross, 173.03);
eq('usd US receipt unchanged', su.foreign.countries.find((c) => c.country === 'US').gross, 50);
eq('usd rate shown', usdc.rate(rs[3]), { rate: 1, date: null });
eq('usd rate EUR receipt', usdc.rate(rs[0]), { rate: 1.1, date: '2026-07-03', eurUsd: 1.1 });
eq('year range', quarterRange(2026, 0), { start: '2026-01-01', end: '2026-12-31' });
eq('year label', quarterLabel(2026, 0), '2026 (full year)');
eq('categories', summarize(rs).categories.length, 1);
await downloadExcel(rs, { ...meta, currency: 'USD', conv: usdc, fileBase: 'usd' });
const wbu = XLSX.read(await files['usd.xlsx'].arrayBuffer(), { cellDates: true });
const detu = XLSX.utils.sheet_to_json(wbu.Sheets.Receipts);
eq('usd excel headers', ['Net USD', 'Rate to USD', 'Rate date'].every((h) => h in detu[0]), true);
eq('usd excel shell gross', detu.find((r) => r.Store === 'Shell')['Gross USD'], 133.1);
// Live ECB rates (network)
const live = await eurUsdRates('2026-09-01', '2026-09-30');
const sat = live('2026-09-05'); // a Saturday
eq('live rate weekend uses Friday', [sat?.date, sat?.rate > 0.8 && sat?.rate < 1.6], ['2026-09-04', true]);
let progress = 0;
await downloadPdf(rs, meta, (n) => { progress = n; });
const pdf = files['Receipts 2026-Q3.pdf'];
const pdfText = await pdf.text();
eq('pdf made', pdf.size > 5000 && pdfText.startsWith('%PDF'), true);
eq('pdf photo pages', progress, 5);
out.push(`\nPDF ${Math.round(pdf.size / 1024)} KB, pages: ${(pdfText.match(/\/Type \/Page\b/g) || []).length}`);
window.lastPdf = pdf;
document.getElementById('out').textContent = `${fail ? fail + ' FAILED' : 'ALL PASS'}\n\n` + out.join('\n');
</script>
